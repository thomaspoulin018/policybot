# Centralized catalogue of all prompts sent to language models.
#
# Structure:
#   prompts.<task>.system        instructions given to the model
#   prompts.<task>.user_template user content with $variable placeholders
#
# Task names match those declared in configs/policybot.yaml.
version: 1

prompts:
  data_classification:
    system: >-
      You analyze the DESCRIPTION of data (never the data itself) that an employee
      intends to submit to an AI tool. Return only JSON with the following boolean
      keys: already_public, contains_personal_info, strategic_sensitive,
      internal_nonpublic, highly_sensitive_secret, and a confidence number from 0
      to 1.
    user_template: "$description"

  tool_type_detection:
    system: >-
      Classify a generative AI tool named by an employee into one of four governance
      categories: 'publique' (publicly accessible, such as ChatGPT or Claude.ai),
      'circuit_ferme' (an enterprise offering governed by a contract, such as
      Copilot Enterprise), 'souveraine' (hosted in Quebec), or 'gouvernementale'
      (hosted by UQAM or the government). Return only JSON with the keys
      iag_type_guess (exactly one of the four values above) and confidence (0-1).
    user_template: "$tool_name"

  mode_detection:
    system: >-
      Determine from an employee's plain-language usage description whether they
      will use a generative AI tool by entering messages directly ('prompt') or
      through a technical/API integration with another system ('api'). Return only
      JSON with the keys mode_guess ('prompt' or 'api') and confidence (0-1).
    user_template: "$description"

  form_suggestions:
    system: >-
      An employee is answering the following form question: "$question". The
      existing choices are: $existing. The employee entered free text that does not
      match any existing choice: "$free_text". Suggest two to four short, precise
      new choices tailored to that text without repeating any existing choice.
      Return only JSON with the key options, containing a list of objects with the
      keys label and description. Write the suggested labels and descriptions in
      French because they are displayed in the French-language user interface.
    user_template: "$free_text"

  contract_extraction:
    system: >-
      You extract normalized contract facts for an AI tool. Return only one JSON
      object. Use only the allowed values listed in the prompt. Answer unknown when
      the evidence does not allow a conclusion. Do not infer guarantees that are
      not written in the evidence.

      The `quote` field is checked mechanically against the evidence text: it is
      accepted only when the string you return also occurs in the evidence. So copy
      it character-for-character, as one uninterrupted run of text from the
      evidence. Never paraphrase, summarize, translate, shorten, join two distant
      sentences, or insert an ellipsis. Copy at least 15 characters, and prefer a
      full sentence. If no sentence in the evidence can be copied to support a
      value, answer unknown for that field.
    user_template: |-
      Required JSON keys. Each key maps to an object {"value": ..., "source_url": ..., "quote": ..., "confidence": 0..1}.
      $fields
      Include every key even when unknown. `quote` must be one contiguous span copied character-for-character from the evidence below, and `source_url` must be the URL of the source it was copied from; without such a quote, answer unknown.

      Evidence:
      $evidence
