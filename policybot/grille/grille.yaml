# Starter rules of thumb. Officers extend this file; it is data, not code.
# Each rule runs only for usages the matrix marks PERMIS / OBLIGATOIRE.
- id: R-07A
  when:
    training_default: ["yes", "unknown"]
    opt_out_available: ["yes"]
    opt_out_confirmed_enabled: ["no", "unknown"]
    data_classification: ["Protégé A", "Protégé B", "Protégé C"]
  then:
    category: "Gestion des données"
    criterion: "Utilisation de données pour entraînement"
    risk_level: "Élevé"
    recommendation: "Autoriser_avec_conditions"
    conditions: ["L'opt-out est disponible, mais son activation n'est pas confirmée pour cette offre — confirmer et documenter son activation avant de soumettre des données classifiées."]
- id: R-07B
  when:
    training_default: ["yes", "unknown"]
    opt_out_available: ["no", "unknown"]
    opt_out_confirmed_enabled: ["no", "unknown"]
    data_classification: ["Protégé A", "Protégé B", "Protégé C"]
  then:
    category: "Gestion des données"
    criterion: "Utilisation de données pour entraînement"
    risk_level: "Élevé"
    recommendation: "Autoriser_avec_conditions"
    conditions: ["Aucune garantie active de retrait de l'entraînement n'est démontrée pour cette offre — ne pas soumettre de données classifiées avant confirmation contractuelle et technique."]
- id: R-12
  when:
    data_residency: ["canada_outside_quebec", "us", "eu", "multi_region", "configurable", "unknown"]
    data_classification: ["Protégé A", "Protégé B"]
  then:
    risk_level: "Modéré"
    recommendation: "Autoriser_avec_conditions"
    conditions: ["Vérifier l'hébergement des données au Québec."]
- id: R-20
  when:
    automated_decisions: ["True"]
  then:
    category: "Éthique et fiabilité des résultats"
    criterion: "Supervision humaine insuffisante"
    risk_level: "Élevé"
    recommendation: "Escalader"
    conditions: ["Décision automatisée affectant des individus — supervision humaine requise."]
- id: R-21
