# Requete Tavily Search de test. La cle API peut aussi venir de TAVILY_API_KEY dans .env.
query: term of use of chat gpt
api_key:

# Options Tavily Search
search_depth: basic
max_results: 5
topic: general
include_answer: false
include_raw_content: false
include_images: false
include_image_descriptions: false
include_favicon: false
include_domains: []
exclude_domains: []
country: canada
auto_parameters: false
exact_match: false
include_usage: false
safe_search: false

# Options optionnelles de date (laisse vides pour ne pas filtrer)
time_range:
start_date:
end_date:
