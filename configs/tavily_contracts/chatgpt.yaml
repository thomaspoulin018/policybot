tool:
  name: ChatGPT
  vendor: OpenAI
  terms_url: https://openai.com/policies/terms-of-use
search_defaults:
  search_depth: advanced
  max_results: 5
  topic: general
  include_answer: false
  include_raw_content: true
  include_images: false
  include_favicon: false
  country: canada
  safe_search: false
  include_domains:
  - openai.com
extract_defaults:
  extract_depth: advanced
  format: markdown
  include_images: false
  include_favicon: false
  timeout: 30
fields:
- name: trains_on_input
  allowed_values:
  - 'yes'
  - 'no'
  - opt_out_available
  - unknown
  query: ChatGPT OpenAI terms use customer content prompts to train models opt out
- name: data_retention
  allowed_values:
  - none
  - limited
  - indefinite
  - unknown
  query: ChatGPT OpenAI privacy data retention deletion policy customer data
- name: data_residency
  allowed_values:
  - canada
  - us
  - eu
  - other
  - unknown
  query: ChatGPT OpenAI data residency hosting location region subprocessors terms
- name: sub_processors
  allowed_values:
  - disclosed
  - undisclosed
  - unknown
  query: ChatGPT OpenAI subprocessors sub-processors list privacy terms
- name: human_review
  allowed_values:
  - 'yes'
  - 'no'
  - unknown
  query: ChatGPT OpenAI human review abuse monitoring customer prompts terms
- name: encryption_standard
  allowed_values:
  - strong
  - partial
  - none
  - unknown
  query: ChatGPT OpenAI encryption in transit at rest security documentation
- name: ip_ownership
  allowed_values:
  - customer
  - vendor
  - unclear
  - unknown
  query: ChatGPT OpenAI ownership output generated content intellectual property terms
- name: applicable_law
  allowed_values:
  - quebec_canada
  - foreign
  - unknown
  query: ChatGPT OpenAI governing law jurisdiction terms of service
- name: foreign_vendor_dependency
  allowed_values:
  - 'yes'
  - 'no'
  - unknown
  query: ChatGPT OpenAI company headquarters cloud provider data hosting country
- name: contract_prohibits_reuse
  allowed_values:
  - 'yes'
  - 'no'
  - unknown
  query: ChatGPT OpenAI contract prohibits reuse customer data confidentiality terms
- name: reentraining_opt_out
  allowed_values:
  - 'yes'
  - 'no'
  - unknown
  query: ChatGPT OpenAI opt out model training customer data prompts outputs
