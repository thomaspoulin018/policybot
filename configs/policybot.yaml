# Configuration non secrète de PolicyBot.
# Les clés API restent dans .env. Les variables d'environnement peuvent
# remplacer ces valeurs; voir .env.example pour leurs noms.
# `timeout` est la durée maximale d'un appel au modèle, en secondes.
version: 1

llm:
  provider: openrouter
  tasks:
    data_classification:
      model: openai/gpt-5.6-luna
      reasoning_effort: low
      max_tokens: 2048
      temperature: 0.0
      timeout: 60

cache:
  arp:
    # read_write: lit le cache et enregistre les nouvelles analyses
    # refresh: ignore le cache existant et le remplace
    # read_only: lit le cache sans jamais écrire
    # disabled: ne lit ni n'écrit dans le cache
    mode: disabled

# Diagnostics locaux en clair : à activer seulement pendant un débogage local.
debug_runs:
  enabled: false
  output_dir: logs/runs
