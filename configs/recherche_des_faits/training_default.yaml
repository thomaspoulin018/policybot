version: 1
fact: training_default
category_arp: "Souveraineté et hébergement des données"
allowed_values: ["yes", "no", "unknown"]
hint: "yes si les contenus soumis servent à entraîner les modèles par défaut; no seulement si l'offre évaluée désactive cet usage par défaut."
exa:
  query: "{tool} {vendor} terms customer content used to train models by default"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 8000}
    highlights: {query: "training customer content opt out", num_sentences: 3}
    summary:
      query: "Does the assessed offering use submitted data to train models by default?"
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["yes", "no", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: true}
