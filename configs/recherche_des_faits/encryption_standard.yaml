version: 1
fact: encryption_standard
category_arp: "Sécurité de l'information"
allowed_values: ["strong", "partial", "none", "unknown"]
hint: "strong seulement si le chiffrement en transit et au repos est explicite; partial si un seul est établi."
exa:
  query: "{tool} {vendor} security encryption at rest in transit TLS AES"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 8000}
    highlights: {query: "encryption at rest in transit TLS", num_sentences: 3}
    summary:
      query: "What encryption category is explicitly documented for data in transit and at rest?"
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["strong", "partial", "none", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: true}
