version: 1
fact: opt_out_available
category_arp: "Souveraineté et hébergement des données"
allowed_values: ["yes", "no", "unknown"]
hint: "yes seulement lorsqu'un contrôle explicite permet de désactiver l'entraînement; sa disponibilité ne prouve pas son activation."
exa:
  query: "{plan} {deployment_mode} {contract_type} {contract_version} {tool} {vendor} opt out disable training customer content terms"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 24000}
    highlights: {query: "opt out disable training", num_sentences: 3}
    summary:
      query: "Is an explicit control available to disable training on submitted data? Return a short, verbatim, continuous quote copied exactly from the returned page text; do not use ellipses."
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["yes", "no", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: false}
