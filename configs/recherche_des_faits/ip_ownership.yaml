version: 1
fact: ip_ownership
category_arp: "Conformité légale et contractuelle"
allowed_values: ["customer", "vendor", "unclear", "unknown"]
hint: "identifier la propriété du contenu généré et les droits sur le contenu soumis."
exa:
  query: "{plan} {deployment_mode} {contract_type} {contract_version} {tool} {vendor} terms intellectual property ownership generated output"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 24000}
    highlights: {query: "ownership intellectual property output", num_sentences: 3}
    summary:
      query: "Who owns generated content under the assessed offering's terms? Return a short, verbatim, continuous quote copied exactly from the returned page text; do not use ellipses."
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["customer", "vendor", "unclear", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: false}
