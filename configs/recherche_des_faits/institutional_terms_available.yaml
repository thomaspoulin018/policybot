version: 1
fact: institutional_terms_available
category_arp: "Conformité légale et contractuelle"
allowed_values: ["yes", "no", "unknown"]
hint: "yes lorsque des conditions propres aux organisations ou institutions sont disponibles; ne pas en déduire leur acceptabilité."
exa:
  query: "{plan} {deployment_mode} {contract_type} {contract_version} {tool} {vendor} enterprise institutional education business terms"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 24000}
    highlights: {query: "enterprise institutional business terms", num_sentences: 3}
    summary:
      query: "Are terms specifically applicable to organizations or institutions available? Return a short, verbatim, continuous quote copied exactly from the returned page text; do not use ellipses."
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["yes", "no", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: false}
