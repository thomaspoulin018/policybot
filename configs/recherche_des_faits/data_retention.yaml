version: 1
fact: data_retention
category_arp: "Souveraineté et hébergement des données"
allowed_values: ["none", "limited", "indefinite", "unknown"]
hint: "limited si la conservation est bornée ou réductible; indefinite si aucune limite de suppression n'est établie."
exa:
  query: "{tool} {vendor} privacy terms data retention deletion period"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 8000}
    highlights: {query: "data retention delete days", num_sentences: 3}
    summary:
      query: "What retention category applies to submitted data: none, limited, or indefinite?"
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["none", "limited", "indefinite", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: true}
