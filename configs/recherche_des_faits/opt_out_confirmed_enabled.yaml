version: 1
fact: opt_out_confirmed_enabled
category_arp: "Souveraineté et hébergement des données"
allowed_values: ["yes", "no", "unknown"]
hint: "yes seulement si une preuve propre à l'offre ou au compte évalué confirme que le retrait est activé."
exa:
  query: "{plan} {deployment_mode} {contract_type} {contract_version} {tool} {vendor} assessed offering opt out training enabled account terms"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 24000}
    highlights: {query: "opt out enabled account training", num_sentences: 3}
    summary:
      query: "Does evidence for the assessed offering confirm that its training opt-out is enabled? Return a short, verbatim, continuous quote copied exactly from the returned page text; do not use ellipses."
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["yes", "no", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: false}
