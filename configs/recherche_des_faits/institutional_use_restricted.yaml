version: 1
fact: institutional_use_restricted
category_arp: "Conformité légale et contractuelle"
allowed_values: ["yes", "no", "unknown"]
hint: "yes lorsqu'une clause restreint l'usage institutionnel; no exige une permission explicite sans restriction."
exa:
  query: "{tool} {vendor} institutional enterprise use restriction terms"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 8000}
    highlights: {query: "institutional enterprise use restriction", num_sentences: 3}
    summary:
      query: "Do the terms explicitly restrict or block the assessed institutional use?"
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["yes", "no", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: true}
