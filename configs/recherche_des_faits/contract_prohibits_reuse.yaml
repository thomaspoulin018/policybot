version: 1
fact: contract_prohibits_reuse
category_arp: "Souveraineté et hébergement des données"
allowed_values: ["yes", "no", "unknown"]
hint: "yes seulement si le contrat interdit explicitement la réutilisation des données soumises."
exa:
  query: "{plan} {deployment_mode} {contract_type} {contract_version} {tool} {vendor} terms contract prohibit reuse submitted customer data"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 24000}
    highlights: {query: "reuse customer data confidential", num_sentences: 3}
    summary:
      query: "Does the contract explicitly prohibit reuse of submitted data? Return a short, verbatim, continuous quote copied exactly from the returned page text; do not use ellipses."
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["yes", "no", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: false}
