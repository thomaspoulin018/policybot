version: 1
fact: dpa_available
category_arp: "Conformité légale et contractuelle"
allowed_values: ["yes", "no", "unknown"]
hint: "yes seulement lorsqu'un accord de traitement des données est explicitement disponible."
exa:
  query: "{plan} {deployment_mode} {contract_type} {contract_version} {tool} {vendor} data processing agreement DPA"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 24000}
    highlights: {query: "data processing agreement DPA", num_sentences: 3}
    summary:
      query: "Is a data processing agreement explicitly available for this offering? Return a short, verbatim, continuous quote copied exactly from the returned page text; do not use ellipses."
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["yes", "no", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: false}
