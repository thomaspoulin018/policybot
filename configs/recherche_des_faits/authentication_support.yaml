version: 1
fact: authentication_support
category_arp: "Sécurité de l'information"
allowed_values: ["sso_mfa", "partial", "none", "unknown"]
hint: "sso_mfa seulement si SSO/SAML/OIDC et MFA sont explicites; partial si un seul est établi."
exa:
  query: "{tool} {vendor} security SSO SAML OIDC MFA authentication"
  type: auto
  num_results: 5
  include_domains: []
  contents:
    text: {max_characters: 8000}
    highlights: {query: "SSO SAML OIDC MFA", num_sentences: 3}
    summary:
      query: "What authentication support category is explicitly documented?"
      schema:
        type: object
        additionalProperties: false
        required: [value, quote, source_url]
        properties:
          value: {type: string, enum: ["sso_mfa", "partial", "none", "unknown"]}
          quote: {type: string}
          source_url: {type: string}
selection: {strategy: source_rank, require_declared_source_url: true}
