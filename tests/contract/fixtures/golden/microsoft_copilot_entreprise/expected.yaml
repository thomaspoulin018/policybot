trains_on_input: "no"               # Prompts/réponses exclus de l'entraînement des modèles de base.
reentraining_opt_out: "yes"         # L'engagement contractuel empêche ce réentraînement.
contract_prohibits_reuse: "yes"     # Microsoft limite l'usage aux instructions du client.
human_review: "no"                  # M365 Copilot est exclu du contrôle d'abus avec revue humaine.

data_retention: limited              # Purview permet de fixer rétention et suppression.
data_residency: other                # Hors UE, le traitement peut avoir lieu dans plusieurs régions.
sub_processors: disclosed           # Une liste officielle des sous-traitants est publiée.
foreign_vendor_dependency: "yes"   # Fournisseur américain et traitement potentiellement étranger.

encryption_standard: strong         # Chiffrement au repos et en transit.
authentication_support: sso_mfa     # Entra SSO (SAML/OIDC) et MFA sont pris en charge.
audit_logging: prompt_output_accessible  # Purview audite prompts, réponses et contenu référencé.
incident_response: documented_with_notice  # Processus documenté et avis sans délai indu.

ip_ownership: customer              # L'Output est Customer Data et Microsoft ne le possède pas.
applicable_law: unknown             # Dépend du contrat institutionnel effectivement signé.

institutional_terms: acceptable     # EDP et DPA visent explicitement les organisations.
quebec_higher_ed_license: "yes"   # Un add-on académique Microsoft 365 Copilot est offert.
