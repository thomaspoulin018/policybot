training_default: "yes"             # Entraînement permis par défaut.
opt_out_available: "yes"            # Le retrait vise explicitement l'entraînement.
opt_out_confirmed_enabled: unknown   # L'activation n'est pas confirmée pour le compte évalué.
contract_prohibits_reuse: "no"      # L'entraînement demeure permis sans retrait.
provider_human_access: "yes"        # Trust & Safety peut consulter les données pour appliquer les règles.

data_retention: limited              # Délais bornés ou suppression sous 30 jours selon le cas.
data_residency: us                   # Transfert explicite vers des serveurs américains.
sub_processors: disclosed           # Anthropic publie une liste des tiers de traitement.
foreign_vendor_dependency: "yes"   # Fournisseur et serveurs américains.

encryption_standard: strong         # Chiffrement explicite en transit et au repos.
authentication_support: partial     # Connexion Google/courriel, sans MFA grand public explicite.
audit_logging: unknown              # Aucun audit institutionnel de prompts/sorties dans ces sources.
incident_response: unknown          # Aucun délai de notification consommateur documenté ici.

ip_ownership: customer              # Anthropic cède ses droits éventuels sur les Outputs.
applicable_law: foreign             # Droit californien.

institutional_terms_available: "yes"  # Les CGU couvrent explicitement les entités.
dpa_available: unknown              # Aucun DPA applicable à cette offre n'est établi ici.
institutional_use_restricted: "no" # Les entités sont explicitement couvertes.
quebec_higher_ed_license: "yes"   # Claude for Education vise l'enseignement supérieur.
