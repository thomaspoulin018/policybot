[project]
name = "policybot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "exa-py>=1.0",
    "python-docx>=1.1",
]

[project.scripts]
policybot = "policybot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Seul le flux OAuth est délégué : l'écrire à la main (échange de code,
# rafraîchissement, serveur de redirection local) est du travail sans
# valeur. Les appels à l'API Forms restent en urllib, comme llm.py.
google = ["google-auth>=2.0", "google-auth-oauthlib>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policybot*"]

[tool.setuptools.data-files]
"configs" = [
    "configs/policybot.yaml",
    "configs/prompts.yaml",
    "configs/formulaire.yaml",
    "configs/formulaire-google.json",
    "configs/recherche_defaults.yaml",
]
"configs/recherche_criteres" = ["configs/recherche_criteres/*.yaml"]
"documents_reference" = [
    "documents_reference/SI_-_Fiche_de_qualification.docx",
    "documents_reference/SI_-_Grille_valuation_des_risques.docx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

