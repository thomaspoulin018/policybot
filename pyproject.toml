[project]
name = "policybot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "exa-py>=1.0",
    "python-docx>=1.1",
]

[project.scripts]
policybot = "policybot.cli:main"

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policybot*"]

[tool.setuptools.data-files]
"configs" = ["configs/recherche_defaults.yaml"]
"configs/recherche_criteres" = ["configs/recherche_criteres/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

