[project]
name = "policybot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langsmith>=0.1",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "exa-py>=1.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60", "reportlab>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policybot*"]

[tool.setuptools.data-files]
"configs" = ["configs/recherche_defaults.yaml"]
"configs/recherche_criteres" = ["configs/recherche_criteres/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

